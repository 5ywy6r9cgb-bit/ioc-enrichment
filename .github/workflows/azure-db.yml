name: azure-db
# Infrastructure only, manual trigger. Migrations are run by the operator
# with deploy/azure/migrate.sh so the database firewall stays closed to runners.
on:
  workflow_dispatch:
    inputs:
      resource_group: { description: Resource group, required: true }
      server_name:    { description: Globally unique server name, required: true }
      client_ip:      { description: Your public IPv4 (the only firewall rule), required: true }
permissions:
  id-token: write
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: azure/arm-deploy@v2
        with:
          resourceGroupName: ${{ inputs.resource_group }}
          template: deploy/azure/main.bicep
          parameters: >-
            serverName=${{ inputs.server_name }}
            clientIp=${{ inputs.client_ip }}
            administratorPassword=${{ secrets.DB_ADMIN_PASSWORD }}
